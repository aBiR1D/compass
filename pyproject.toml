[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "compass"
version = "0.1.0"
description = "AI Life Strategist — personalized daily micro-actions that compound into massive change"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "typer>=0.9",
    "rich>=13.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "anthropic>=0.25",
    "openai>=1.0",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "httpx>=0.27",
    "mcp[cli]>=1.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "aiosqlite>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
]

[project.scripts]
compass = "compass.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["compass"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
